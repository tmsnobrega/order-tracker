apiVersion: 1
groups:
  - orgId: 1
    name: order-lookups
    folder: Homework 04
    interval: 10s
    rules:
      - uid: order-lookup-5xx
        title: Order lookup server errors
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              expr: 'sum(increase(http_server_requests_total{http_route="/api/orders/{order_id}",http_response_status_code=~"5.."}[1m])) or vector(0)'
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              type: math
              expression: '$A > 0'
              refId: C
        labels:
          alertname: OrderLookup5xx
          service: order-tracker
          severity: warning
        annotations:
          summary: Order lookups are returning server errors.
          endpoint: /api/orders/{order_id}
          time_window: 1 minute
          __dashboardUid__: order-tracker
          __panelId__: '2'
          dashboard: http://localhost:3000/d/order-tracker/order-tracker
        notification_settings:
          receiver: homework-responder
